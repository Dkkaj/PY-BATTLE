name: Build PYBattle Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Restore app/google-services.json & debug.keystore
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "Restoring app/google-services.json for Firebase & Google Sign-In"
            echo "" | base64 -d > app/google-services.json
          fi
          if [ ! -f "debug.keystore" ]; then
            echo "Restoring Firebase-registered debug.keystore"
            echo "" | base64 -d > debug.keystore
          fi

      - name: Ensure .env file exists for Secrets Plugin
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload PYBattle APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PYBattle-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build PYBattle Android APK

on:
push:
branches: ["main", "master"]
pull_request:
branches: ["main", "master"]
workflow_dispatch:

permissions:
contents: read

jobs:
build-apk:
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Set up JDK 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Accept Android SDK Licenses and Install SDK
    run: |
      yes | sdkmanager --licenses || true
      sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

  - name: Prepare Debug Keystore
    run: |
      if [ -f "debug.keystore" ]; then
        echo "Using existing debug.keystore"
      elif [ -f "debug.keystore.base64" ]; then
        base64 -d debug.keystore.base64 > debug.keystore
      else
        keytool -genkeypair -v \
          -keystore debug.keystore \
          -storepass android \
          -alias androiddebugkey \
          -keypass android \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"
      fi

  - name: Ensure .env file exists
    run: |
      if [ ! -f ".env" ] && [ -f ".env.example" ]; then
        cp .env.example .env
      elif [ ! -f ".env" ]; then
        touch .env
      fi

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Check Gradle Wrapper
    run: |
      if [ ! -f "./gradlew" ]; then
        echo "ERROR: gradlew is missing from the project root."
        exit 1
      fi
      chmod +x ./gradlew

  - name: Build Debug APK
    run: ./gradlew :app:assembleDebug --no-daemon

  - name: Upload PYBattle APK Artifact
    uses: actions/upload-artifact@v4
    with:
      name: PYBattle-debug-apk
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error

name: Build PYBattle APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      # 1. Download project source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Android SDK
      - name: Install Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk

      # 4. Configure Android SDK paths
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/lib/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/lib/android-sdk" >> "$GITHUB_ENV"
          echo "/usr/lib/android-sdk/platform-tools" >> "$GITHUB_PATH"

      # 5. Check project files
      - name: Check project structure
        run: |
          ls -la
          test -d app
          test -f settings.gradle.kts
          test -f build.gradle.kts

      # 6. Install Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 7. Build APK
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      # 8. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PYBattle-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
